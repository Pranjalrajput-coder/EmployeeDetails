version: 0.2

phases:
  install:
    runtime-versions:
      java: corretto17
  build:
    commands:
      - echo Build Process is Started, Please Wait...
      - mvn clean package -DskipTests -Dspring.profiles.active=prod
  post_build:
    commands:
      - echo Build is Completed ✅
artifacts:
  files:
    - target/*.jar
  discard-paths: yes